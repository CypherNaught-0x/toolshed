<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How Toolshed Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#ffffff; font-family:'JetBrains Mono',monospace; color:#0f172a; padding:36px 24px; }
  .wrap { max-width:1200px; margin:0 auto; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#047857"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#b45309"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#b91c1c"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>

  <!-- ================= HERMES HOST BOUNDARY (the agent's home) ================= -->
  <rect x="25" y="150" width="1130" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="176" fill="#475569" font-size="11" font-weight="600" letter-spacing="2">HERMES AGENT — the host · Toolshed lives here as a plugin, but never becomes the agent</text>

  <!-- ================= EXTERNAL: THE SHED (above) ================= -->
  <!-- The shed = Toolshed's own space OUTSIDE the agent -->
  <g>
    <!-- roof -->
    <polygon points="330,28 640,28 685,72 285,72" fill="#1e3a8a"/>
    <text x="485" y="58" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">T O O L S H E D</text>
    <!-- body -->
    <rect x="300" y="72" width="320" height="130" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="320" y="98" fill="#1d4ed8" font-size="10" letter-spacing="1.5">EXTERNAL PROXY — outside the agent core</text>
    <line x1="320" y1="108" x2="600" y2="108" stroke="#bfdbfe" stroke-width="1"/>
    <text x="320" y="128" fill="#0f172a" font-size="12" font-weight="700">· deterministic rules (local, free)</text>
    <text x="320" y="147" fill="#0f172a" font-size="12" font-weight="700">· per-profile state &amp; grants</text>
    <text x="320" y="166" fill="#0f172a" font-size="12" font-weight="700">· cache-stable session surfaces</text>
    <text x="320" y="190" fill="#64748b" font-size="9">the agent core is never modified — Toolshed only decides what the provider request carries</text>
  </g>

  <!-- INPUT enters from left into the shed -->
  <rect x="40" y="105" width="185" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="130" fill="#64748b" font-size="10" letter-spacing="1">FIRST USER TURN</text>
  <text x="58" y="150" fill="#0f172a" font-size="12" font-weight="700">classified once,</text>
  <text x="58" y="166" fill="#0f172a" font-size="12" font-weight="700">sticky for the session</text>
  <line x1="227" y1="140" x2="292" y2="140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

  <!-- Shed decides: two exits -->
  <!-- EXIT 1: confident → narrow (goes down INTO the host) -->
  <path d="M 560 202 L 560 240 L 780 240" fill="none" stroke="#047857" stroke-width="3.5" marker-end="url(#ag)"/>
  <text x="600" y="232" fill="#047857" font-size="11" font-weight="700">CONFIDENT → NARROW</text>

  <!-- EXIT 2: not sure → fail open (stays wide) -->
  <path d="M 400 202 L 400 240 L 250 265" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#aa)"/>
  <text x="255" y="235" fill="#b45309" font-size="10" font-weight="600">NOT SURE → FULL SURFACE</text>

  <!-- EXIT 3: no grant → off (right side, dead end) -->
  <path d="M 620 202 L 620 240 L 905 265" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="800" y="235" fill="#b91c1c" font-size="10" font-weight="600">NO GRANT → STAYS OFF</text>
  <rect x="900" y="248" width="230" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="918" y="270" fill="#0f172a" font-size="12" font-weight="700">Install ≠ authorization</text>
  <text x="918" y="288" fill="#64748b" font-size="10">fail-closed by design</text>

  <!-- ================= INSIDE THE HOST ================= -->

  <!-- NARROW outcome lands here -->
  <rect x="700" y="215" width="180" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="718" y="236" fill="#047857" font-size="10" letter-spacing="1">NARROW SURFACE</text>
  <text x="718" y="255" fill="#0f172a" font-size="12" font-weight="700">likely tools + floor</text>

  <!-- FAIL OPEN lands here -->
  <rect x="90" y="250" width="220" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="108" y="271" fill="#b45309" font-size="10" letter-spacing="1">FULL SURFACE</text>
  <text x="108" y="290" fill="#0f172a" font-size="12" font-weight="700">nothing removed, ever</text>

  <!-- MODEL PROVIDER -->
  <rect x="520" y="300" width="280" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="326" fill="#7c3aed" font-size="10" letter-spacing="1.5">MODEL PROVIDER REQUEST</text>
  <text x="540" y="352" fill="#0f172a" font-size="14" font-weight="800">selected schemas only</text>
  <text x="540" y="370" fill="#64748b" font-size="10">cache reads the stable session prefix on every turn</text>

  <!-- narrow -> model -->
  <path d="M 790 265 Q 850 300 805 315 L 805 340 " fill="none" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>

  <!-- CACHE HIT annotation next to model -->
  <rect x="830" y="305" width="200" height="66" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="846" y="330" fill="#047857" font-size="10" letter-spacing="1">CACHE HIT EVERY TURN</text>
  <text x="846" y="349" fill="#0f172a" font-size="11" font-weight="700">stable prefix = cheap turns</text>
  <text x="846" y="364" fill="#64748b" font-size="9">session-sticky surface never re-prunes</text>
  <line x1="802" y1="338" x2="826" y2="338" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ag)"/>

  <!-- fail-open -> model -->
  <path d="M 310 300 Q 380 330 512 335" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#aa)"/>

  <!-- RECOVERY -->
  <rect x="60" y="360" width="260" height="62" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="78" y="384" fill="#b91c1c" font-size="10" letter-spacing="1">CAPABILITY MISSING?</text>
  <text x="78" y="406" fill="#0f172a" font-size="12" font-weight="700">Recover: add that toolset</text>
  <path d="M 518 395 L 330 392" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="395" y="386" fill="#94a3b8" font-size="9">missing tool mid-task?</text>
  <!-- loop back to model -->
  <path d="M 190 424 L 190 442 L 560 442 L 610 385" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="240" y="437" fill="#64748b" font-size="9">permanent for this session · normal checks still apply</text>

  <!-- ================= MULTI-AGENT STRIP ================= -->
  <rect x="25" y="480" width="1130" height="115" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="506" fill="#475569" font-size="11" font-weight="600" letter-spacing="2">MULTI-AGENT — one shed, many workers · every profile gets its own isolated instance</text>

  <g font-size="10">
    <rect x="60" y="525" width="330" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="78" y="546" fill="#1d4ed8" letter-spacing="1">AGENT A</text>
    <text x="78" y="564" fill="#475569">own routes · own grants · own learning state</text>

    <rect x="450" y="525" width="330" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="468" y="546" fill="#1d4ed8" letter-spacing="1">AGENT B</text>
    <text x="468" y="564" fill="#475569">own routes · own grants · own learning state</text>

    <rect x="840" y="525" width="295" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="858" y="546" fill="#475569" letter-spacing="1">NEVER SHARED</text>
    <text x="858" y="564" fill="#64748b">workflow data never crosses agents</text>
  </g>

  <!-- ================= TRUST LINE (bottom) ================= -->
  <text x="590" y="640" fill="#475569" font-size="11" text-anchor="middle" font-weight="600">31% less input on fresh installs · 32–70% in controlled A/B workloads · fail-open by design</text>
  <text x="590" y="660" fill="#94a3b8" font-size="10" text-anchor="middle">github.com/Huy3ko/toolshed · MIT · fork of hermes-token-router</text>

</svg>
</div>
</body>
</html>
