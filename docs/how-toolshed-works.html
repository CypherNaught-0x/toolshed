<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How Toolshed Works — Adaptive Tool-Surface Proxy for Hermes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#020617;
    font-family:'JetBrains Mono',monospace;
    color:#e2e8f0;
    min-height:100vh;
    padding:40px 24px;
  }
  .wrap { max-width:1240px; margin:0 auto; }
  header { text-align:center; margin-bottom:36px; }
  h1 { font-size:34px; font-weight:800; letter-spacing:-1px; color:#f1f5f9; }
  h1 span { color:#22d3ee; }
  .sub { color:#94a3b8; font-size:13px; margin-top:10px; }
  .sub b { color:#34d399; }
  .card {
    background:rgba(15,23,42,.55);
    border:1px solid #1e293b;
    border-radius:14px;
    padding:28px;
  }
  svg { width:100%; height:auto; display:block; }
  .badges { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
  .badge {
    border:1px solid #334155; border-radius:999px; padding:7px 16px;
    font-size:10px; letter-spacing:1.5px; color:#94a3b8;
  }
  .badge.g { border-color:#065f46; color:#34d399; }
  .badge.c { border-color:#155e75; color:#22d3ee; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>How <span>Toolshed</span> works</h1>
  <p class="sub">Shrink the tool surface when confidence is high. <b>Keep every capability reachable when it is not.</b></p>
</header>

<div class="card">
<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrCyan" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrRose" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#020617"/>
  <rect x="0" y="0" width="1180" height="620" fill="url(#grid)"/>

  <!-- ============ ARROWS (behind boxes) ============ -->
  <!-- input -> route -->
  <line x1="200" y1="130" x2="285" y2="130" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <!-- route -> decide -->
  <line x1="500" y1="130" x2="585" y2="130" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrCyan)"/>
  <!-- decide -> narrow (YES) -->
  <line x1="790" y1="105" x2="865" y2="105" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="805" y="95" fill="#94a3b8" font-size="10">confident</text>
  <!-- decide -> fail-open (UNCERTAIN) -->
  <path d="M 790 160 Q 830 220 865 250" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="790" y="215" fill="#94a3b8" font-size="10">uncertain</text>
  <!-- narrow -> main model -->
  <path d="M 1045 140 L 1045 330 L 900 355" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <!-- fail-open -> main model -->
  <line x1="1000" y1="310" x2="900" y2="380" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <!-- main model -> recover -->
  <line x1="650" y1="400" x2="420" y2="400" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRose)"/>
  <text x="455" y="388" fill="#94a3b8" font-size="10">missing capability?</text>
  <!-- recover loop back to model -->
  <path d="M 300 480 Q 300 530 660 520" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="548" fill="#64748b" font-size="9">expansion is permanent for this session · tools are never re-pruned · normal checks &amp; approvals still apply</text>

  <!-- ============ BOXES ============ -->

  <!-- 01 INPUT -->
  <g>
    <rect x="60" y="85" width="140" height="90" rx="8" fill="#0f172a"/>
    <rect x="60" y="85" width="140" height="90" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="78" y="112" fill="#22d3ee" font-size="9" letter-spacing="1.5">01 · INPUT</text>
    <text x="78" y="134" fill="#f1f5f9" font-size="13" font-weight="700">First user turn</text>
    <text x="78" y="152" fill="#94a3b8" font-size="9">classified once,</text>
    <text x="78" y="163" fill="#94a3b8" font-size="9">session-sticky after that</text>
  </g>

  <!-- 02 ROUTE -->
  <g>
    <rect x="290" y="75" width="210" height="110" rx="8" fill="#0f172a"/>
    <rect x="290" y="75" width="210" height="110" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="308" y="102" fill="#22d3ee" font-size="9" letter-spacing="1.5">02 · ROUTE</text>
    <text x="308" y="126" fill="#f1f5f9" font-size="14" font-weight="700">Deterministic rules</text>
    <text x="308" y="146" fill="#94a3b8" font-size="9">fast · local · zero model cost</text>
    <text x="308" y="168" fill="#64748b" font-size="9">optional LLM classifier for ambiguous turns</text>
  </g>

  <!-- 03 DECIDE -->
  <g>
    <rect x="590" y="70" width="200" height="115" rx="8" fill="#0f172a"/>
    <rect x="590" y="70" width="200" height="115" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="608" y="97" fill="#22d3ee" font-size="9" letter-spacing="1.5">03 · DECIDE</text>
    <text x="608" y="121" fill="#f1f5f9" font-size="14" font-weight="700">Confidence gate</text>
    <text x="608" y="141" fill="#94a3b8" font-size="9">known toolsets? valid output?</text>
    <text x="608" y="154" fill="#94a3b8" font-size="9">above threshold?</text>
    <text x="608" y="174" fill="#64748b" font-size="9">fail-closed on grant, fail-open on routing</text>
  </g>

  <!-- NARROW (green outcome) -->
  <g>
    <rect x="870" y="70" width="230" height="80" rx="8" fill="#0f172a"/>
    <rect x="870" y="70" width="230" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="888" y="96" fill="#34d399" font-size="9" letter-spacing="1.5">NARROW</text>
    <text x="888" y="120" fill="#f1f5f9" font-size="14" font-weight="700">Likely toolsets only</text>
    <text x="888" y="138" fill="#94a3b8" font-size="9">floor tools always stay loaded</text>
  </g>

  <!-- FAIL OPEN (amber outcome) -->
  <g>
    <rect x="870" y="235" width="230" height="85" rx="8" fill="#0f172a"/>
    <rect x="870" y="235" width="230" height="85" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="888" y="261" fill="#fbbf24" font-size="9" letter-spacing="1.5">FAIL OPEN</text>
    <text x="888" y="285" fill="#f1f5f9" font-size="14" font-weight="700">Full tool surface</text>
    <text x="888" y="303" fill="#94a3b8" font-size="9">no capability is ever removed</text>
  </g>

  <!-- 04 MAIN MODEL -->
  <g>
    <rect x="655" y="340" width="245" height="105" rx="8" fill="#0f172a"/>
    <rect x="655" y="340" width="245" height="105" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="673" y="367" fill="#a78bfa" font-size="9" letter-spacing="1.5">04 · MAIN MODEL</text>
    <text x="673" y="391" fill="#f1f5f9" font-size="14" font-weight="700">Provider request</text>
    <text x="673" y="411" fill="#94a3b8" font-size="9">receives the selected schema set —</text>
    <text x="673" y="423" fill="#94a3b8" font-size="9">31% smaller input on fresh installs,</text>
    <text x="673" y="435" fill="#94a3b8" font-size="9">up to 70% on full tool surfaces</text>
  </g>

  <!-- 05 RECOVER -->
  <g>
    <rect x="60" y="350" width="240" height="100" rx="8" fill="#0f172a"/>
    <rect x="60" y="350" width="240" height="100" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="78" y="377" fill="#fb7185" font-size="9" letter-spacing="1.5">05 · RECOVER IF NEEDED</text>
    <text x="78" y="401" fill="#f1f5f9" font-size="14" font-weight="700">Add the missing toolset</text>
    <text x="78" y="421" fill="#94a3b8" font-size="9">automatic middleware + visible request_toolset</text>
    <text x="78" y="438" fill="#64748b" font-size="9">proven in adversarial tests: task stays solvable</text>
  </g>

  <!-- SECURITY GRANT box (right bottom) -->
  <g>
    <rect x="870" y="430" width="270" height="90" rx="8" fill="#0f172a"/>
    <rect x="870" y="430" width="270" height="90" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="888" y="456" fill="#fb7185" font-size="9" letter-spacing="1.5">AUTHORIZATION GATE</text>
    <text x="888" y="479" fill="#f1f5f9" font-size="12" font-weight="700">tools.override = explicit grant</text>
    <text x="888" y="497" fill="#94a3b8" font-size="9">install ≠ authorization · no grant → router stays off</text>
    <text x="888" y="512" fill="#64748b" font-size="8">repo content / prompts can never extend policy</text>
  </g>
  <!-- dashed line from auth gate to decide -->
  <line x1="868" y1="475" x2="700" y2="190" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ BADGES ============ -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="1.2">
    <rect x="60"  y="575" width="150" height="30" rx="15" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="135" y="594" fill="#34d399">FAIL-OPEN SAFETY</text>

    <rect x="230" y="575" width="145" height="30" rx="15" fill="rgba(15,23,42,0.6)" stroke="#334155"/>
    <text x="302" y="594" fill="#94a3b8">SESSION-STICKY</text>

    <rect x="395" y="575" width="170" height="30" rx="15" fill="rgba(15,23,42,0.6)" stroke="#334155"/>
    <text x="480" y="594" fill="#94a3b8">MONOTONIC GROWTH</text>

    <rect x="585" y="575" width="120" height="30" rx="15" fill="rgba(15,23,42,0.6)" stroke="#334155"/>
    <text x="645" y="594" fill="#94a3b8">PLUGIN-ONLY</text>

    <rect x="725" y="575" width="175" height="30" rx="15" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
    <text x="812" y="594" fill="#fb7185">EXPLICIT GRANT ONLY</text>
  </g>

</svg>
</div>

<div class="badges">
  <div class="badge g">✓ validated on fresh hermes installs</div>
  <div class="badge c">→ github.com/Huy3ko/toolshed</div>
  <div class="badge">v0.1.x · MIT · fork of hermes-token-router</div>
</div>

</div>
</body>
</html>
