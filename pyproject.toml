[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshed"
version = "0.1.0"
description = "An adaptive tool-surface proxy for Hermes — reduces repeated tool-schema overhead while preserving on-demand recovery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Toolshed contributors" }]
keywords = ["hermes", "agent", "llm", "tools", "router", "token-optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/TOOLSHED-ORG/toolshed"
ADR-Docs = "https://github.com/TOOLSHED-ORG/toolshed/tree/main/adr"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["toolshed", "toolshed.learning_store", "toolshed.telemetry_store"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
