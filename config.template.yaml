# Toolshed router configuration; disabled until explicitly enabled.
# After installation grant the declared capability with:
#   hermes plugins enable hermes-token-router --allow-tool-override
global:
  enabled: false
  routing_scope: first_turn
  expansion_mode: monotonic
  shrink_mid_session: false
  floor_toolsets: [terminal, file, skills, memory, web]
  excluded_toolsets: []
  deterministic_rules_enabled: true
  audit:
    rare_max: 2
    frequent_min: 5
  confidence_threshold: 0.90
  router_timeout_ms: 750
  router_hard_timeout_ms: 1200
  fail_open: true
  auto_recover_registered_tools: true
  classifier:
    enabled: false
    provider: null
    model: null
    base_url: null
    api_key_env: null
profiles: {}
# Metrics are profile-scoped and local-only. Example:
# profiles:
#   default:
#     metrics:
#       enabled: true
#       local_only: true
#       retain_days: 30
shadow:
  enabled: false
  store_path: learning/profiles.json
  events_path: learning/events.jsonl
  floor_toolsets: [terminal, file, skills, memory, web]
  max_warm: 8
  channel: cli
